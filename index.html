<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading lesson…</title></head>
<body>
<script>
(async()=>{
  const version='20261013-2';

  async function loadText(name){
    const r=await fetch(`${name}?v=${version}`,{cache:'no-store'});
    if(!r.ok) throw new Error(`Could not load ${name}`);
    return r.text();
  }

  const baseNames=Array.from({length:12},(_,i)=>`parts/app-${String(i+1).padStart(2,'0')}.txt`);
  const addonNames=Array.from({length:8},(_,i)=>`parts/neural-ode-${String(i+1).padStart(2,'0')}.txt`);

  const [baseParts,addonParts]=await Promise.all([
    Promise.all(baseNames.map(loadText)),
    Promise.all(addonNames.map(loadText))
  ]);

  let lesson=baseParts.join('');

  const oldBlock='<div class="grid cards3">\n      <div class="card"><div class="small muted">Prerequisite</div><div><b>Partial derivatives, gradients, chain rule</b></div></div>\n      <div class="card"><div class="small muted">Central question</div><div><b>How does calculus tell neural networks and CNNs how to learn?</b></div></div>\n      <div class="card panel small" style="margin-top:14px"><div class="h3">How to use this app</div><p>Work through the four tabs in order. Read each short explanation, interact with the sliders and diagrams, and pause at the prediction questions and checkpoints before moving on. Try to connect each neural-network idea back to the calculus concepts you already know.</p></div>\n    </div>';
  const newBlock='<div class="grid cards2">\n      <div class="card"><div class="small muted">Prerequisite</div><div><b>Partial derivatives, gradients, chain rule</b></div></div>\n      <div class="card"><div class="small muted">Central question</div><div><b>How does calculus tell neural networks and CNNs how to learn?</b></div></div>\n    </div>\n    <div class="small" style="margin-top:14px">\n      <div class="h3">How to use this app</div>\n      <p>Work through the four visible tabs in order. Read each short explanation, interact with the sliders and diagrams, and pause at the prediction questions and checkpoints before moving on. Try to connect each neural-network idea back to the calculus concepts you already know.</p>\n    </div>';
  lesson=lesson.replace(oldBlock,newBlock);

  const byline='<p class="small" style="margin:6px 0 0"><b>by Andrew Bennett and Nhung Nguyen</b></p>';
  if(!lesson.includes('by Andrew Bennett and Nhung Nguyen')){
    lesson=lesson.replace(/(<h1\s+class=["']title["'][^>]*>[^<]*<\/h1>)/i,'$1\n    '+byline);
  }

  // Hide the CNN tab, but keep the entire CNN section and code intact.
  lesson=lesson.replace(
    '<button class="btn tab" data-tab="cnn">4. Images & CNNs</button>',
    '<button class="btn tab" data-tab="cnn" style="display:none" aria-hidden="true">4. Images & CNNs</button>'
  );

  // Send the learner from Gradient Descent directly to Neural ODE.
  lesson=lesson.replace(/data-next="cnn"/g,'data-next="neuralode"');
  lesson=lesson.replace(/Continue to Images & CNNs\s*→/g,'Continue to Neural ODEs →');

  lesson=lesson.replace(/\s*<div class="card panel small">\s*Try[\s\S]*?severe overshooting\/saturation\.\s*<\/div>/g,'');
  lesson=lesson.replace(/\s*<div class="card panel small">\s*<strong>You may change[\s\S]*?fixed during each run\.\s*<\/div>/g,'');

  let addonText=addonParts.join('');
  // CNN remains stored as the hidden section 4; Neural ODE becomes section 4 for the visible lesson.
  addonText=addonText.replace(/Section 5/g,'Section 4');
  addonText=addonText.replace(/5\. Neural ODEs/g,'4. Neural ODEs');
  // The Neural ODE add-on used to add a Continue button after CNN. Add it after Gradient Descent instead.
  addonText=addonText.replace("const cnn=document.getElementById('panel-cnn');","const cnn=document.getElementById('panel-learn');");

  // Turn the solve-it-yourself activity into a worked example while keeping the hidden
  // interactive elements in the DOM so the existing training code remains untouched.
  addonText=addonText.replace(
    'Interactive example · Solve an ODE, then compare with the Neural ODE',
    'Worked example · From a known solution to learning from observations'
  );
  addonText=addonText.replace(
    '<p class="small">\n        First solve this ODE yourself:\n      </p>',
    '<p class="small">\n        To make the Neural ODE experiment easy to check, start with a simple ODE whose exact solution is known:\n      </p>'
  );
  addonText=addonText.replace(
    '<p class="small">\n        Find an explicit formula for\n        \\(z(t)\\).\n        Then enter your answer below using <code>t</code>.\n      </p>',
    '<p class="small">The exact solution is</p>\n      <div class="card center math-cell" style="font-size:1.2em">\n        \\[z(t)=2e^{-0.5t}.\\]\n      </div>\n      <div class="card panel small" style="margin-top:12px">\n        <strong>Now change perspective:</strong> imagine that the differential equation and exact formula are hidden. We keep only the observed values for \\(0\\le t\\le3\\) shown below. The Neural ODE will learn \\(f_\\theta\\) from those observations and then continue the trajectory beyond \\(t=3\\). Because we know the exact solution in this example, we can reveal it after training as a benchmark for comparison.\n      </div>'
  );
  addonText=addonText.replace(
    '<div class="card" style="margin-top:10px;padding:14px;max-width:760px">',
    '<div class="card" style="display:none;margin-top:10px;padding:14px;max-width:760px">'
  );
  addonText=addonText.replace(
    '<div id="odeStudentFeedback" class="card panel small" style="margin-top:12px">',
    '<div id="odeStudentFeedback" class="card panel small" style="display:none;margin-top:12px">'
  );
  addonText=addonText.replace(
    '<div class="card" style="margin-top:14px">\n        <div class="h3">Your analytic solution</div>',
    '<div class="card" style="display:none;margin-top:14px">\n        <div class="h3">Your analytic solution</div>'
  );
  addonText=addonText.replace(
    '<button id="odeResetExampleBtn" class="btn ghost">Reset all</button>',
    '<button id="odeResetExampleBtn" class="btn ghost" style="display:none">Reset all</button>'
  );

  lesson=lesson.replace('</body>',addonText+'\n</body>');

  document.open();
  document.write(lesson);
  document.close();
})().catch(err=>{
  document.title='Lesson loading error';
  document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">'+err.message+'</pre>';
});
</script>
</body>
</html>
