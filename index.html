<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading lesson…</title></head>
<body>
<script>
(async()=>{
  const version='20261025-9';

  async function loadText(name){
    const r=await fetch(`${name}?v=${version}`,{cache:'no-store'});
    if(!r.ok) throw new Error(`Could not load ${name}`);
    return r.text();
  }

  const baseNames=Array.from({length:12},(_,i)=>`parts/app-${String(i+1).padStart(2,'0')}.txt`);
  const addonNames=Array.from({length:8},(_,i)=>`parts/neural-ode-${String(i+1).padStart(2,'0')}.txt`);

  const [baseParts,addonParts]=await Promise.all([
    Promise.all(baseNames.map(loadText)),
    Promise.all(addonNames.map(loadText))
  ]);

  let lesson=baseParts.join('');

  const oldBlock='<div class="grid cards3">\n      <div class="card"><div class="small muted">Prerequisite</div><div><b>Partial derivatives, gradients, chain rule</b></div></div>\n      <div class="card"><div class="small muted">Central question</div><div><b>How does calculus tell neural networks and CNNs how to learn?</b></div></div>\n      <div class="card panel small" style="margin-top:14px"><div class="h3">How to use this app</div><p>Work through the four tabs in order. Read each short explanation, interact with the sliders and diagrams, and pause at the prediction questions and checkpoints before moving on. Try to connect each neural-network idea back to the calculus concepts you already know.</p></div>\n    </div>';
  const newBlock='<div class="grid cards2">\n      <div class="card"><div class="small muted">Prerequisite</div><div><b>Partial derivatives, gradients, chain rule</b></div></div>\n      <div class="card"><div class="small muted">Central question</div><div><b>How does calculus tell neural networks and CNNs how to learn?</b></div></div>\n    </div>\n    <div class="small" style="margin-top:14px">\n      <div class="h3">How to use this app</div>\n      <p>Work through the five visible tabs in order. Read each short explanation, interact with the sliders and diagrams, and pause at the prediction questions and checkpoints before moving on. Try to connect each neural-network idea back to the calculus concepts you already know.</p>\n    </div>';
  lesson=lesson.replace(oldBlock,newBlock);

  const byline='<p class="small" style="margin:6px 0 0"><b>by Andrew Bennett and Nhung Nguyen</b></p>';
  if(!lesson.includes('by Andrew Bennett and Nhung Nguyen')){
    lesson=lesson.replace(/(<h1\s+class=["']title["'][^>]*>[^<]*<\/h1>)/i,'$1\n    '+byline);
  }

  lesson=lesson.replace(
    '<button class="btn tab" data-tab="cnn">5. Images & CNNs</button>',
    '<button class="btn tab" data-tab="cnn" style="display:none" aria-hidden="true">5. Images & CNNs</button>'
  );

  lesson=lesson.replace(/data-next="cnn"/g,'data-next="neuralode"');
  lesson=lesson.replace(/Continue to Images & CNNs\s*→/g,'Continue to Neural ODEs →');

  lesson=lesson.replace(/\s*<div class="card panel small">\s*Try[\s\S]*?severe overshooting\/saturation\.\s*<\/div>/g,'');
  lesson=lesson.replace(/\s*<div class="card panel small">\s*<strong>You may change[\s\S]*?fixed during each run\.\s*<\/div>/g,'');

  let addonText=addonParts.join('');
  addonText=addonText.replace("const cnn=document.getElementById('panel-cnn');","const cnn=document.getElementById('panel-bigpicture');");

  addonText=addonText.replace(
    'Interactive example · Solve an ODE, then compare with the Neural ODE',
    'Worked example · From a known solution to learning from observations'
  );
  addonText=addonText.replace(
    '<p class="small">\n        First solve this ODE yourself:\n      </p>',
    '<p class="small">\n        To make the Neural ODE experiment easy to check, start with a simple ODE whose exact solution is known:\n      </p>'
  );
  addonText=addonText.replace(
    '<p class="small">\n        Find an explicit formula for\n        \\(z(t)\\).\n        Then enter your answer below using <code>t</code>.\n      </p>',
    '<p class="small">The exact solution is</p>\n      <div class="card center math-cell" style="font-size:1.2em">\n        \\[z(t)=2e^{-0.5t}.\\]\n      </div>\n      <div class="card panel small" style="margin-top:12px">\n        <strong>Now change perspective:</strong> imagine that the differential equation and exact formula are hidden. We will choose how much of the trajectory is observed, train the Neural ODE only on those observations, and then ask it to continue beyond the last observed time. Because the exact solution is known in this example, we can reveal it after training as a benchmark.\n      </div>'
  );
  addonText=addonText.replace(
    '<div class="card" style="margin-top:10px;padding:14px;max-width:760px">',
    '<div class="card" style="display:none;margin-top:10px;padding:14px;max-width:760px">'
  );
  addonText=addonText.replace(
    '<div id="odeStudentFeedback" class="card panel small" style="margin-top:12px">',
    '<div id="odeStudentFeedback" class="card panel small" style="display:none;margin-top:12px">'
  );
  addonText=addonText.replace(
    '<div class="card" style="margin-top:14px">\n        <div class="h3">Your analytic solution</div>',
    '<div class="card" style="display:none;margin-top:14px">\n        <div class="h3">Your analytic solution</div>'
  );
  addonText=addonText.replace(
    '<button id="odeResetExampleBtn" class="btn ghost">Reset all</button>',
    '<button id="odeResetExampleBtn" class="btn ghost" style="display:none">Reset all</button>'
  );

  addonText=addonText.replace(
    '<div class="node-train-left">',
    '<div class="node-train-left">\n            <div class="card panel small" style="padding:10px 12px;margin-bottom:9px">\n              <strong>Choose the observation window</strong>\n              <p style="margin:4px 0 7px">How much of the trajectory should the Neural ODE be allowed to see before it predicts the future?</p>\n              <div style="display:flex;gap:7px;flex-wrap:wrap">\n                <button type="button" class="btn ghost ode-obs-window" data-obs-end="1.5">Observe to \\(t=1.5\\)</button>\n                <button type="button" class="btn ghost ode-obs-window" data-obs-end="2">Observe to \\(t=2\\)</button>\n                <button type="button" class="btn ode-obs-window active" data-obs-end="3">Observe to \\(t=3\\)</button>\n              </div>\n              <p class="muted" style="margin:7px 0 0">Before training, predict: will seeing a longer interval make the future prediction more reliable?</p>\n            </div>\n\n            <div class="card small" style="padding:10px 12px;margin-bottom:9px">\n              <strong>Experiment settings</strong>\n              <p style="margin:4px 0 7px">Edit the values, then click <b>Apply settings</b>.</p>\n              <textarea id="odeExperimentCode" spellcheck="false" aria-label="Neural ODE experiment settings" style="width:100%;min-height:105px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f172a;color:#e5e7eb">observation_end = 3.0\nlearning_rate   = 0.35\ntime_step       = 0.02</textarea>\n              <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px">\n                <button type="button" id="odeApplySettingsBtn" class="btn">Apply settings</button>\n                <span id="odeSettingsStatus" class="muted">Try changing one value at a time.</span>\n              </div>\n            </div>\n\n            <div class="card small" style="padding:10px 12px;margin-bottom:9px">\n              <strong>Simplified Neural ODE code</strong>\n              <p style="margin:4px 0 7px">This is the same training loop shown in the diagrams above, written as compact Python-style pseudocode.</p>\n              <pre style="margin:0;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f172a;color:#e5e7eb;white-space:pre"># neural network: predicts the rate of change\ndef f_theta(t, z):\n    return neural_network(t, z)\n\n# one ODE-solver step (Euler)\nz_next = z + time_step * f_theta(t, z)\n\n# build the predicted trajectory\nfor t in observed_times:\n    z = ode_step(f_theta, t, z)\n\n# compare with observations\nloss = mean((z_pred - z_data)**2)\n\n# learn the network parameters\nloss.backward()\ntheta = theta - learning_rate * theta.grad\n\n# after training, continue past the data\nfor t in future_times:\n    z = ode_step(f_theta, t, z)</pre>\n              <p class="muted" style="margin:7px 0 0">The same neural network \\(f_\\theta\\) is reused at every time step. Only the inputs \\(t\\) and \\(z(t)\\) change.</p>\n            </div>'
  );

  addonText=addonText.replace('const obsEnd = 3;','let obsEnd = 3;');
  addonText=addonText.replace('const internalLearningRate = 0.35;','let internalLearningRate = 0.35;\n  let solverDt = 0.02;');
  addonText=addonText.replace('const dt = 0.02;','const dt = solverDt;');
  addonText=addonText.replace(
    'for(const t of obsTimes){\n      const x = xMap(t);',
    'for(const t of obsTimes){\n      if(t > obsEnd + 1e-12) continue;\n      const x = xMap(t);'
  );

  addonText=addonText.replace(
    "const oneStepBtn = document.getElementById('odeOneStepBtn');",
    "const oneStepBtn = document.getElementById('odeOneStepBtn');\n  const obsWindowBtns = [...document.querySelectorAll('.ode-obs-window')];\n  const experimentCode = document.getElementById('odeExperimentCode');\n  const applySettingsBtn = document.getElementById('odeApplySettingsBtn');\n  const settingsStatus = document.getElementById('odeSettingsStatus');"
  );

  addonText=addonText.replace(
    "status.innerHTML =\n      'Training reset. The plot now shows only the observed data points. Start with one training step to reveal the Neural ODE trajectory.';",
    "status.innerHTML =\n      'Training reset. The model can currently see observations only through t=' + obsEnd + '. Start with one training step, then compare this result with different settings.';"
  );

  addonText=addonText.replace(
    "oneStepBtn.addEventListener('click',()=>takeTrainingSteps(1));",
    "oneStepBtn.addEventListener('click',()=>takeTrainingSteps(1));\n\n  obsWindowBtns.forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      obsEnd = Number(btn.dataset.obsEnd);\n      if(experimentCode){\n        experimentCode.value = experimentCode.value.replace(/observation_end\\s*=\\s*[-+]?\\d*\\.?\\d+/,'observation_end = ' + obsEnd.toFixed(1));\n      }\n      obsWindowBtns.forEach(x=>x.classList.remove('active'));\n      btn.classList.add('active');\n      resetTraining();\n    });\n  });\n\n  function readSetting(name,text){\n    const m=text.match(new RegExp(name + '\\\\s*=\\\\s*([-+]?\\\\d*\\\\.?\\\\d+(?:[eE][-+]?\\\\d+)?)'));\n    return m ? Number(m[1]) : NaN;\n  }\n\n  if(applySettingsBtn && experimentCode){\n    applySettingsBtn.addEventListener('click',()=>{\n      const text=experimentCode.value;\n      const newObsEnd=readSetting('observation_end',text);\n      const newLR=readSetting('learning_rate',text);\n      const newDt=readSetting('time_step',text);\n\n      if(!Number.isFinite(newObsEnd) || newObsEnd<0.5 || newObsEnd>3 ||\n         !Number.isFinite(newLR) || newLR<=0 || newLR>1.5 ||\n         !Number.isFinite(newDt) || newDt<0.005 || newDt>0.2){\n        if(settingsStatus) settingsStatus.innerHTML='<b>Check the values.</b> Use observation_end from 0.5 to 3, learning_rate from 0 to 1.5, and time_step from 0.005 to 0.2.';\n        return;\n      }\n\n      obsEnd=newObsEnd;\n      internalLearningRate=newLR;\n      solverDt=newDt;\n      obsWindowBtns.forEach(btn=>{\n        btn.classList.toggle('active',Math.abs(Number(btn.dataset.obsEnd)-obsEnd)<1e-10);\n      });\n      if(settingsStatus) settingsStatus.innerHTML='<b>Settings applied.</b> Train the model and observe what changes.';\n      resetTraining();\n    });\n  }"
  );

  addonText=addonText.replace(
    'Train \\(z\'(t)=f_\\theta(t,z(t))\\) using only the observations on\n          \\(0\\le t\\le3\\), then continue the learned dynamics to \\(t=6\\).',
    'Choose how much of the observed trajectory to reveal, adjust the experiment settings if you want, train \\(z\'(t)=f_\\theta(t,z(t))\\), then continue the learned dynamics to \\(t=6\\).'
  );

  addonText=addonText.replace(
    '<li>Does the fit on \\(0\\le t\\le3\\) improve as the loss decreases?</li>',
    '<li>Does the fit on the chosen observation interval improve as the loss decreases?</li>'
  );
  addonText=addonText.replace(
    '<li>How does the prediction for \\(t>3\\) compare with the true solution?</li>',
    '<li>Change <code>learning_rate</code>. How does the speed or stability of training change?</li>'
  );
  addonText=addonText.replace(
    '<li>Does a small training loss guarantee a perfect future prediction?</li>',
    '<li>Change <code>time_step</code>. Does the numerical trajectory change noticeably? Then compare different observation windows.</li>'
  );

  // Let the runnable code control how far the observed data extend.
  addonText=addonText.replace('  const observationEnd = 3.0;','  const observationEnd = 4.0;');
  addonText=addonText.replace(
    '  const observedTimes = [0,0.5,1,1.5,2,2.5,3]\n    .filter(t => t <= observationEnd + 1e-12);',
    '  const observedTimes = [];\n  for(let t=0;t<=observationEnd+1e-12;t+=0.5){\n    observedTimes.push(Number(t.toFixed(10)));\n  }'
  );
  addonText=addonText.replace(
    '    const obsTimes=[0,0.5,1,1.5,2,2.5,3].filter(t=>t<=result.observationEnd+1e-12);',
    '    const obsTimes=[];\n    for(let t=0;t<=result.observationEnd+1e-12;t+=0.5){\n      obsTimes.push(Number(t.toFixed(10)));\n    }'
  );

  // Record the loss at uniform 50-step checkpoints in the runnable experiment.
  addonText=addonText.replace(
    '  const eps=1e-4;\n  for(let step=0;step<trainSteps;step++){',
    '  const eps=1e-4;\n  const lossHistory=[{step:0,loss:loss(theta)}];\n  for(let step=0;step<trainSteps;step++){'
  );
  addonText=addonText.replace(
    '    for(let i=0;i<theta.length;i++){\n      theta[i] -= learningRate*grad[i];\n    }\n  }\n\n  return {',
    '    for(let i=0;i<theta.length;i++){\n      theta[i] -= learningRate*grad[i];\n    }\n    if((step+1)%50===0 || step+1===trainSteps){\n      lossHistory.push({step:step+1,loss:loss(theta)});\n    }\n  }\n\n  return {'
  );
  addonText=addonText.replace(
    '    loss: loss(theta)\n  };',
    '    loss: loss(theta),\n    lossHistory\n  };'
  );
  addonText=addonText.replace(
    '    <p class="muted" style="margin:7px 0 0">Try changing <code>hiddenSize</code>, <code>learningRate</code>, <code>timeStep</code>, <code>trainSteps</code>, or <code>observationEnd</code>.</p>`;',
    '    <div id="odeLossHistory" class="card panel small" style="margin-top:10px;padding:9px 11px"><strong>Loss during training</strong><div class="muted" style="margin-top:4px">Run the code to see the loss every 50 iterations.</div></div>\n    <p class="muted" style="margin:7px 0 0">Try changing <code>hiddenSize</code>, <code>learningRate</code>, <code>timeStep</code>, <code>trainSteps</code>, or <code>observationEnd</code>.</p>`;'
  );
  addonText=addonText.replace(
    '      if(lossEl) lossEl.textContent=Number(r.loss).toExponential(3);\n      runStatus.innerHTML=',
    '      if(lossEl) lossEl.textContent=Number(r.loss).toExponential(3);\n      const historyEl=document.getElementById(\'odeLossHistory\');\n      if(historyEl && Array.isArray(r.lossHistory)){\n        const rows=r.lossHistory.map(item=>\'<tr><td style="padding:3px 8px;text-align:center">\'+item.step+\'</td><td style="padding:3px 8px;text-align:center">\'+Number(item.loss).toExponential(3)+\'</td></tr>\').join(\'\');\n        historyEl.innerHTML=\'<strong>Loss during training</strong><table style="width:100%;border-collapse:collapse;margin-top:5px"><thead><tr><th style="padding:3px 8px;border-bottom:1px solid var(--border)">Iteration</th><th style="padding:3px 8px;border-bottom:1px solid var(--border)">Loss</th></tr></thead><tbody>\'+rows+\'</tbody></table>\';\n      }\n      runStatus.innerHTML='
  );

  // The runnable code now contains the experiment parameters, so remove the older settings panel.
  addonText += '\n<script>(function(){const e=document.getElementById("odeExperimentCode");if(e){const c=e.closest(".card");if(c)c.remove();}})();<\/script>';

  // Keep the visible observation table synchronized with observationEnd in the runnable code.
  addonText += `
<script>
(function(){
  const editor=document.getElementById('odeRunnableCode');
  const runBtn=document.getElementById('odeRunCodeBtn');
  const resetBtn=document.getElementById('odeResetCodeBtn');
  const left=document.querySelector('.node-train-left');
  if(!editor || !left) return;

  const dataCard=[...left.querySelectorAll('.card')].find(card =>
    card.textContent.includes('Observed data')
  );
  const tbody=dataCard && dataCard.querySelector('tbody');
  if(!tbody) return;

  function observationEndFromCode(){
    const match=editor.value.match(/const\\s+observationEnd\\s*=\\s*([-+]?\\d*\\.?\\d+)/);
    return match ? Number(match[1]) : NaN;
  }

  function syncObservationTable(){
    const end=observationEndFromCode();
    if(!Number.isFinite(end) || end<0 || end>6) return;
    let rows='';
    for(let t=0;t<=end+1e-12;t+=0.5){
      const tt=Number(t.toFixed(10));
      const z=2*Math.exp(-0.5*tt);
      const label=Number.isInteger(tt) ? tt.toFixed(0) : tt.toFixed(1);
      rows += '<tr><td style="padding:3px 7px;text-align:center">'+label+
              '</td><td style="padding:3px 7px;text-align:center">'+z.toFixed(4)+'</td></tr>';
    }
    tbody.innerHTML=rows;
  }

  syncObservationTable();
  if(runBtn) runBtn.addEventListener('click',syncObservationTable);
  if(resetBtn) resetBtn.addEventListener('click',()=>setTimeout(syncObservationTable,0));
})();
<\/script>`;

  lesson=lesson.replace('</body>',addonText+'\n</body>');

  document.open();
  document.write(lesson);
  document.close();
})().catch(err=>{
  document.title='Lesson loading error';
  document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">'+err.message+'</pre>';
});
</script>
</body>
</html>
